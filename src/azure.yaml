# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
name: agent-framework-agent-with-foundry-toolbox-responses
services:
  agent-framework-agent-with-foundry-toolbox-responses:
    project: agent-framework-agent-with-foundry-toolbox-responses
    host: azure.ai.agent
    language: python
    uses:
      - ai-project
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1.0Gi
    description: Caldova social media campaign assistant that drafts posts promoting
      Caldova's pharmaceutical products, using File Search over the product
      catalog for accurate product details and Web Search for timely campaign
      context such as season, awareness days, and current topics.
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: gpt-5.4-mini
      - name: TOOLBOX_ENDPOINT
        value: ${TOOLBOX_ENDPOINT}
    kind: hosted
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Streaming
    name: agent-framework-agent-with-foundry-toolbox-responses
    protocols:
      - protocol: responses
        version: 2.0.0
  ai-project:
    host: azure.ai.project
    deployments:
      - model:
          format: OpenAI
          name: gpt-5.4-mini
          version: "2026-03-17"
        name: gpt-5.4-mini
        sku:
          capacity: 10
          name: GlobalStandard
infra:
  provider: microsoft.foundry
